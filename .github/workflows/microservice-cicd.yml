name: Microservice CI/CD Pipeline

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Name of the microservice (e.g., user-service)'
        required: true
        type: string
      environment:
        description: 'Deployment environment (dev or prod)'
        required: true
        type: string
      java-version:
        description: 'Java version to use'
        required: false
        type: string
        default: '11'
      maven-version:
        description: 'Maven version to use'
        required: false
        type: string
        default: '3.9'
      k8s-namespace:
        description: 'Kubernetes namespace'
        required: false
        type: string
        default: ''
      skip-tests:
        description: 'Skip unit tests'
        required: false
        type: boolean
        default: false

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gitversion.outputs.semVer }}
      image-tag: ${{ steps.generate-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for GitVersion

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}
          cache: 'maven'

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0
        with:
          useConfigFile: false
          additionalArguments: '/config mode=Mainline'

      - name: Generate image tag
        id: generate-tag
        run: |
          if [ "${{ inputs.environment }}" == "dev" ]; then
            echo "tag=v${{ steps.gitversion.outputs.semVer }}-dev" >> $GITHUB_OUTPUT
          else
            echo "tag=v${{ steps.gitversion.outputs.semVer }}" >> $GITHUB_OUTPUT
          fi

      - name: Display version
        run: |
          echo "Version: ${{ steps.gitversion.outputs.semVer }}"
          echo "Image Tag: ${{ steps.generate-tag.outputs.tag }}"
          echo "Environment: ${{ inputs.environment }}"

      - name: Run unit tests
        if: ${{ !inputs.skip-tests }}
        run: mvn test -B

      - name: Generate test report
        if: false  # Temporarily disabled - requires additional GitHub token permissions
        uses: dorny/test-reporter@v1
        with:
          name: Unit Tests Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service-name }}-${{ steps.generate-tag.outputs.tag }}
          path: target/*.jar
          retention-days: 7

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}
          cache: 'maven'

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Get AKS credentials
        run: |
          if [ "${{ inputs.environment }}" == "dev" ]; then
            az aks get-credentials --resource-group ${{ vars.AKS_RG_DEV }} --name ${{ vars.AKS_CLUSTER_DEV }} --overwrite-existing
          else
            az aks get-credentials --resource-group ${{ vars.AKS_RG_PROD }} --name ${{ vars.AKS_CLUSTER_PROD }} --overwrite-existing
          fi

      - name: Get SonarQube configuration
        id: sonar-config
        run: |
          NAMESPACE="${{ inputs.environment == 'dev' && 'ecommerce-dev' || 'ecommerce-prod' }}"

          # Get SonarQube LoadBalancer external IP
          SONAR_IP=$(kubectl get svc sonarqube -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          SONAR_URL="http://${SONAR_IP}:9000"
          echo "sonar-url=$SONAR_URL" >> $GITHUB_OUTPUT

          # Use SonarQube token if available, otherwise default admin credentials
          SONAR_TOKEN="${{ secrets.SONAR_TOKEN }}"
          if [ -z "$SONAR_TOKEN" ]; then
            echo "sonar-login=admin" >> $GITHUB_OUTPUT
          else
            echo "sonar-login=$SONAR_TOKEN" >> $GITHUB_OUTPUT
          fi

          echo "SonarQube URL: $SONAR_URL"

      - name: Wait for SonarQube to be ready
        run: |
          SONAR_URL="${{ steps.sonar-config.outputs.sonar-url }}"
          MAX_RETRIES=12
          RETRY_COUNT=0

          echo "Waiting for SonarQube to be ready at $SONAR_URL..."

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' $SONAR_URL/api/system/status || echo "000")

            if [[ "$STATUS" == "200" ]]; then
              echo "✅ SonarQube is ready!"
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "SonarQube not ready yet (attempt $RETRY_COUNT/$MAX_RETRIES), waiting..."
            sleep 5
          done

          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "❌ SonarQube not ready after $MAX_RETRIES attempts"
            exit 1
          fi

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        run: |
          # Run SonarQube scan using kubectl exec to run from inside cluster
          NAMESPACE="${{ inputs.environment == 'dev' && 'ecommerce-dev' || 'ecommerce-prod' }}"

          mvn sonar:sonar \
            -Dsonar.projectKey=${{ inputs.service-name }} \
            -Dsonar.projectName=${{ inputs.service-name }} \
            -Dsonar.host.url=${{ steps.sonar-config.outputs.sonar-url }} \
            -Dsonar.login=${{ steps.sonar-config.outputs.sonar-login }} \
            -Dsonar.qualitygate.wait=false \
            -B || echo "⚠️ SonarQube scan completed with warnings"

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.service-name }}-${{ needs.build-and-test.outputs.image-tag }}
          path: target/

      - name: Run Trivy vulnerability scanner on JAR
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'target/'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner on Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'Dockerfile'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  build-and-push-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality, security-scan]
    outputs:
      login-server: ${{ steps.acr.outputs.login-server }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set ACR name
        id: acr
        run: |
          if [ "${{ inputs.environment }}" == "dev" ]; then
            echo "name=${{ vars.ACR_NAME_DEV }}" >> $GITHUB_OUTPUT
            echo "login-server=${{ vars.ACR_NAME_DEV }}.azurecr.io" >> $GITHUB_OUTPUT
          else
            echo "name=${{ vars.ACR_NAME_PROD }}" >> $GITHUB_OUTPUT
            echo "login-server=${{ vars.ACR_NAME_PROD }}.azurecr.io" >> $GITHUB_OUTPUT
          fi

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ steps.acr.outputs.name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.acr.outputs.login-server }}/${{ inputs.service-name }}:${{ needs.build-and-test.outputs.image-tag }}
            ${{ steps.acr.outputs.login-server }}/${{ inputs.service-name }}:latest-${{ inputs.environment }}
          cache-from: type=registry,ref=${{ steps.acr.outputs.login-server }}/${{ inputs.service-name }}:buildcache-${{ inputs.environment }}
          cache-to: type=registry,ref=${{ steps.acr.outputs.login-server }}/${{ inputs.service-name }}:buildcache-${{ inputs.environment }},mode=max
          build-args: |
            SPRING_PROFILES_ACTIVE=${{ inputs.environment }}

      - name: Run Trivy vulnerability scanner on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.acr.outputs.login-server }}/${{ inputs.service-name }}:${{ needs.build-and-test.outputs.image-tag }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Create Git tag
        if: inputs.environment == 'prod'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "${{ needs.build-and-test.outputs.image-tag }}" -m "Release ${{ needs.build-and-test.outputs.image-tag }}"
          git push origin "${{ needs.build-and-test.outputs.image-tag }}"

  deploy-to-aks:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: [build-and-test, build-and-push-image]
    environment: ${{ inputs.environment }}

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Checkout manifests repository
        uses: actions/checkout@v4
        with:
          repository: IngesoftV-backend-microservices/manifests-k8s
          ref: develop  # Use develop branch for manifests
          token: ${{ secrets.GH_PAT }}
          path: manifests

      - name: Set deployment variables
        id: vars
        run: |
          if [ "${{ inputs.environment }}" == "dev" ]; then
            echo "namespace=ecommerce-dev" >> $GITHUB_OUTPUT
            echo "cluster-name=${{ vars.AKS_CLUSTER_DEV }}" >> $GITHUB_OUTPUT
            echo "resource-group=${{ vars.AKS_RG_DEV }}" >> $GITHUB_OUTPUT
          else
            echo "namespace=ecommerce-prod" >> $GITHUB_OUTPUT
            echo "cluster-name=${{ vars.AKS_CLUSTER_PROD }}" >> $GITHUB_OUTPUT
            echo "resource-group=${{ vars.AKS_RG_PROD }}" >> $GITHUB_OUTPUT
          fi

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group ${{ steps.vars.outputs.resource-group }} --name ${{ steps.vars.outputs.cluster-name }} --overwrite-existing

      - name: Update image tag in kustomization
        working-directory: manifests/overlays/${{ inputs.environment }}
        run: |
          # Update image tag for the specific service
          SERVICE_NAME="${{ inputs.service-name }}"
          NEW_TAG="${{ needs.build-and-test.outputs.image-tag }}"

          # Update the newTag for the specific service in kustomization.yaml
          sed -i "/name: selimhorri\/${SERVICE_NAME}-ecommerce-boot/,/newTag:/ s/newTag: .*/newTag: ${NEW_TAG}/" kustomization.yaml

          echo "Updated ${SERVICE_NAME} image tag to ${NEW_TAG}"
          grep -A 2 "name: selimhorri/${SERVICE_NAME}-ecommerce-boot" kustomization.yaml

      - name: Deploy to AKS
        working-directory: manifests/overlays/${{ inputs.environment }}
        run: |
          kubectl apply -k . --namespace=${{ steps.vars.outputs.namespace }}

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/${{ inputs.service-name }} \
            --namespace=${{ steps.vars.outputs.namespace }} \
            --timeout=5m

      - name: Verify deployment
        run: |
          echo "Deployment verification for ${{ inputs.service-name }}"
          kubectl get pods -n ${{ steps.vars.outputs.namespace }} -l app=${{ inputs.service-name }}
          kubectl get svc -n ${{ steps.vars.outputs.namespace }} -l app=${{ inputs.service-name }}

      - name: Health check
        run: |
          echo "Running health check for ${{ inputs.service-name }}"

          SERVICE_NAME="${{ inputs.service-name }}"
          NAMESPACE="${{ steps.vars.outputs.namespace }}"

          # Get service ClusterIP
          SERVICE_IP=$(kubectl get svc $SERVICE_NAME -n $NAMESPACE -o jsonpath='{.spec.clusterIP}')
          SERVICE_PORT=$(kubectl get svc $SERVICE_NAME -n $NAMESPACE -o jsonpath='{.spec.ports[0].port}')

          # Health check URL with service context path
          HEALTH_URL="http://$SERVICE_IP:$SERVICE_PORT/$SERVICE_NAME/actuator/health"

          echo "Service IP: $SERVICE_IP:$SERVICE_PORT"
          echo "Health URL: $HEALTH_URL"

          # Run health check from inside cluster using a temporary pod
          HTTP_CODE=$(kubectl run health-check-pod-${{ github.run_id }} \
            --image=curlimages/curl:latest \
            --restart=Never \
            --namespace=$NAMESPACE \
            --rm -i \
            --command -- \
            sh -c "curl -s -o /dev/null -w '%{http_code}' $HEALTH_URL" 2>/dev/null || echo "000")

          echo "HTTP Response Code: $HTTP_CODE"

          # Check if response code starts with 200
          if [[ "$HTTP_CODE" == 200* ]]; then
            echo "✅ Health check passed for ${{ inputs.service-name }}"
          else
            echo "❌ Health check failed for ${{ inputs.service-name }} (HTTP $HTTP_CODE)"
            exit 1
          fi

  integration-e2e-tests:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    needs: [deploy-to-aks]

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Get AKS credentials
        run: |
          if [ "${{ inputs.environment }}" == "dev" ]; then
            az aks get-credentials --resource-group ${{ vars.AKS_RG_DEV }} --name ${{ vars.AKS_CLUSTER_DEV }} --overwrite-existing
          else
            az aks get-credentials --resource-group ${{ vars.AKS_RG_PROD }} --name ${{ vars.AKS_CLUSTER_PROD }} --overwrite-existing
          fi

      - name: Checkout tests repository
        uses: actions/checkout@v4
        with:
          repository: IngesoftV-backend-microservices/tests
          ref: develop
          token: ${{ secrets.GH_PAT }}
          path: tests

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get service endpoints
        id: endpoints
        run: |
          NAMESPACE="${{ inputs.environment == 'dev' && 'ecommerce-dev' || 'ecommerce-prod' }}"

          # Get API Gateway LoadBalancer IP
          API_GATEWAY_IP=$(kubectl get svc api-gateway -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")

          # If LoadBalancer IP not available, use port-forward approach or internal DNS
          if [ -z "$API_GATEWAY_IP" ]; then
            echo "base-host=api-gateway.$NAMESPACE.svc.cluster.local" >> $GITHUB_OUTPUT
          else
            echo "base-host=$API_GATEWAY_IP" >> $GITHUB_OUTPUT
          fi

      - name: Run integration tests
        working-directory: tests
        env:
          BASE_HOST: ${{ steps.endpoints.outputs.base-host }}
          TEST_TIMEOUT: 30
        run: |
          SERVICE_NAME="${{ inputs.service-name }}"
          SERVICE_TEST_FILE="integration/test_${SERVICE_NAME//-/_}.py"

          # Check if test file exists
          if [ -f "$SERVICE_TEST_FILE" ]; then
            echo "Running integration tests for $SERVICE_NAME"

            mkdir -p reports/integration

            pytest $SERVICE_TEST_FILE \
              -v \
              --html=reports/integration/report_${SERVICE_NAME}.html \
              --self-contained-html \
              --junitxml=reports/integration/junit_${SERVICE_NAME}.xml \
              --tb=short \
              || TEST_FAILED=1

            if [ "$TEST_FAILED" = "1" ]; then
              echo "⚠️ Integration tests failed but continuing pipeline"
            fi
          else
            echo "No integration tests found for $SERVICE_NAME, skipping"
          fi

      - name: Run E2E tests
        working-directory: tests
        env:
          BASE_HOST: ${{ steps.endpoints.outputs.base-host }}
          TEST_TIMEOUT: 60
        run: |
          SERVICE_NAME="${{ inputs.service-name }}"
          E2E_TEST_FILE="e2e/test_e2e_${SERVICE_NAME//-/_}.py"

          # Check if E2E test file exists
          if [ -f "$E2E_TEST_FILE" ]; then
            echo "Running E2E tests for $SERVICE_NAME"

            mkdir -p reports/e2e

            pytest $E2E_TEST_FILE \
              -v \
              --html=reports/e2e/report_${SERVICE_NAME}.html \
              --self-contained-html \
              --junitxml=reports/e2e/junit_${SERVICE_NAME}.xml \
              --tb=short \
              || E2E_FAILED=1

            if [ "$E2E_FAILED" = "1" ]; then
              echo "⚠️ E2E tests failed but continuing pipeline"
            fi
          else
            echo "No E2E tests found for $SERVICE_NAME, skipping"
          fi

      - name: Generate test coverage report
        if: always()
        working-directory: tests
        run: |
          # Generate combined coverage report if tests were executed
          if [ -d "reports" ]; then
            echo "# Test Execution Summary" > reports/summary.md
            echo "" >> reports/summary.md
            echo "**Service**: ${{ inputs.service-name }}" >> reports/summary.md
            echo "**Environment**: ${{ inputs.environment }}" >> reports/summary.md
            echo "**Date**: $(date)" >> reports/summary.md
            echo "" >> reports/summary.md

            # Count test results from JUnit XML files
            if ls reports/integration/junit_*.xml 1> /dev/null 2>&1; then
              echo "### Integration Tests" >> reports/summary.md
              python -c "import xml.etree.ElementTree as ET; tree = ET.parse('reports/integration/junit_${{ inputs.service-name }}.xml'); root = tree.getroot(); print(f'- Tests: {root.attrib.get(\"tests\", \"N/A\")}'); print(f'- Failures: {root.attrib.get(\"failures\", \"N/A\")}'); print(f'- Errors: {root.attrib.get(\"errors\", \"N/A\")}')" >> reports/summary.md 2>/dev/null || echo "- No integration test results" >> reports/summary.md
            fi

            if ls reports/e2e/junit_*.xml 1> /dev/null 2>&1; then
              echo "" >> reports/summary.md
              echo "### E2E Tests" >> reports/summary.md
              python -c "import xml.etree.ElementTree as ET; tree = ET.parse('reports/e2e/junit_${{ inputs.service-name }}.xml'); root = tree.getroot(); print(f'- Tests: {root.attrib.get(\"tests\", \"N/A\")}'); print(f'- Failures: {root.attrib.get(\"failures\", \"N/A\")}'); print(f'- Errors: {root.attrib.get(\"errors\", \"N/A\")}')" >> reports/summary.md 2>/dev/null || echo "- No E2E test results" >> reports/summary.md
            fi
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ inputs.service-name }}-${{ inputs.environment }}
          path: tests/reports/
          retention-days: 30

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality, security-scan, build-and-push-image, deploy-to-aks, integration-e2e-tests]
    if: always()

    steps:
      - name: Determine overall status
        id: status
        run: |
          if [ "${{ needs.build-and-test.result }}" == "failure" ] || \
             [ "${{ needs.code-quality.result }}" == "failure" ] || \
             [ "${{ needs.security-scan.result }}" == "failure" ] || \
             [ "${{ needs.build-and-push-image.result }}" == "failure" ] || \
             [ "${{ needs.deploy-to-aks.result }}" == "failure" ] || \
             [ "${{ needs.integration-e2e-tests.result }}" == "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        if: false  # Disabled for now
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ steps.status.outputs.emoji }} Pipeline ${{ steps.status.outputs.status }} for ${{ inputs.service-name }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.status.outputs.emoji }} Pipeline ${{ steps.status.outputs.status }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Service:*\n${{ inputs.service-name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\n${{ inputs.environment }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n${{ needs.build-and-test.outputs.image-tag }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Triggered by:*\n${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Status:*\n• Build & Test: ${{ needs.build-and-test.result }}\n• Code Quality: ${{ needs.code-quality.result }}\n• Security Scan: ${{ needs.security-scan.result }}\n• Build Image: ${{ needs.build-and-push-image.result }}\n• Deploy: ${{ needs.deploy-to-aks.result }}\n• Integration/E2E Tests: ${{ needs.integration-e2e-tests.result }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Create GitHub deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: '${{ inputs.environment }}',
              auto_merge: false,
              required_contexts: []
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: '${{ steps.status.outputs.status }}',
              description: 'Deployment ${{ steps.status.outputs.status }} for ${{ inputs.service-name }}',
              environment: '${{ inputs.environment }}'
            });
